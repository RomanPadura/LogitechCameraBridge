name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10, Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LogitechCameraBridgeSln.sln

      - name: Build
        run: dotnet build LogitechCameraBridgeSln.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test LogitechCameraBridgeSln.sln --configuration Release --no-build --no-restore --logger trx --results-directory TestResults --blame-hang-timeout 2m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
